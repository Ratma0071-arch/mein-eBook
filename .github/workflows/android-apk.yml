name: mein eBook APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Projekt auspacken
        run: unzip -o mein-eBook-Quellcode-fuer-GitHub.zip -d .
      - name: APK bauen
        run: gradle --no-daemon assembleDebug
      - name: Emulator vorbereiten
        run: sudo chmod a+rw /dev/kvm
      - name: Vorlesen bei ausgeschaltetem Bildschirm testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: mein-eBook-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Testberichte
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
